<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تسجيل الدخول — تيكا</title>
<style>
/* -------------------- Reset -------------------- */
* {margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI',sans-serif;}
body {background:#fafafa; color:#222;}

/* -------------------- Header -------------------- */
header {
  background:#fff;
  padding:15px 25px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  border-bottom:1px solid #eee;
}
.logo {font-size:22px; font-weight:700; color:#ff6b35;}
nav a {
  text-decoration:none;
  color:#333;
  margin-left:15px;
  padding:8px 12px;
  border-radius:8px;
}
nav a.active {background:#ff6b35; color:white;}

/* -------------------- Login Box -------------------- */
.auth-page {
  display:flex;
  justify-content:center;
  align-items:center;
  height:80vh;
}
.auth-card {
  background:#fff;
  padding:25px;
  border-radius:12px;
  width:350px;
  box-shadow:0 4px 10px rgba(0,0,0,0.08);
}
.auth-card h2 {text-align:center; margin-bottom:20px;}
.auth-card input {
  width:100%;
  padding:12px;
  margin-bottom:12px;
  border-radius:10px;
  border:1px solid #ccc;
}
.auth-card button {
  width:100%;
  padding:12px;
  background:#ff6b35;
  color:white;
  border:none;
  border-radius:10px;
  cursor:pointer;
}
.auth-card button:hover {background:#e55a26;}
.auth-card p {text-align:center; margin-top:12px; font-size:14px;}
.auth-card p a {color:#ff6b35; text-decoration:none;}
.auth-card p a:hover {text-decoration:underline;}
</style>
</head>

<body>

<header>
  <div class="logo">تيكا</div>
  <nav>
    <a href="index.html">الرئيسية</a>
    <a href="menu.html">المينيو</a>
    <a href="cart.html">السلة</a>
    <a class="active" href="login.html">دخول</a>
  </nav>
</header>

<div class="auth-page">
  <div class="auth-card">
    <h2>تسجيل دخول</h2>
    <input type="email" placeholder="البريد الإلكتروني">
    <input type="password" placeholder="كلمة المرور">
    <button>دخول</button>
    <p>
      ليس لديك حساب؟ 
      <a href="signup.html">سجل الآن</a>
    </p>
  </div>
</div>

</body>
</html>
